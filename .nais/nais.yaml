apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: dp-permittering-statistikk
  namespace: teamdagpenger
  labels:
    team: teamdagpenger
    subteam: stsb
    fagsystem: dagpenger
spec:
  image: "{{ image }}"
  liveness:
    path: /isalive
  readiness:
    path: /isready
  port: 8080
  prometheus:
    enabled: true
    path: /metrics
  observability:
    logging:
      destinations:
        - id: loki
        - id: elastic
    autoInstrumentation:
      enabled: true
      runtime: java
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
  kafka:
    pool: "{{ kafka_pool }}"
  env:
    - name: JDK_JAVA_OPTIONS
      value: -XX:+UseParallelGC -XX:MaxRAMPercentage=50.0 -XX:ActiveProcessorCount=4
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
