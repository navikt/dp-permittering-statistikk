apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: dp-permittering-statistikk
  namespace: teamdagpenger
  labels:
    team: teamdagpenger
    subteam: stsb
    okonomisystem: "false"
    fagsystem: dagpenger
spec:
  image: "{{ image }}"
  liveness:
    path: /isalive
  readiness:
    path: /isready
  port: 8080
  prometheus:
    enabled: true
    path: /metrics
  observability:
    logging:
      destinations:
        - id: loki
        - id: elastic
    autoInstrumentation:
      enabled: true
      runtime: java
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 256Mi
  azure:
    application:
      enabled: true
  kafka:
    pool: "{{ kafka_pool }}"
  env:
    - name: JDK_JAVA_OPTIONS
      value: -XX:+UseParallelGC -XX:MaxRAMPercentage=50.0 -XX:ActiveProcessorCount=4
    - name: SOKNAD_ORKESTRATOR_API_SCOPE
      value: "{{ dp-soknad-orkestrator.scope }}"
  gcp:
    sqlInstances:
      - collation: nb_NO.UTF8
        databases:
          - envVarPrefix: DB
            name: permitteringsstatistikk
        diskAutoresize: true
        diskType: SSD
        highAvailability: {{ db.highAvailability }}
        insights:
          enabled: true
          queryStringLength: 4500
          recordApplicationTags: true
          recordClientAddress: true
        maintenance:
          day: 1
          hour: 4
        pointInTimeRecovery: {{ db.pointInTimeRecovery }}
        tier: "{{ db.tier }}"
        type: POSTGRES_18
        flags:
          - name: cloudsql.enable_pgaudit
            value: "true"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
        - application: dp-behandling
